const CFG = window.RAIL_CONFIG || {};

const db = {
  async loadAll() {
    const [items, settings, trips, outfits] = await Promise.all([
      supa.from("items").select("*").order("created_at", { ascending: true }),
      supa.from("closet_settings").select("*"),
      supa.from("trips").select("*"),
      supa.from("outfits").select("*"),
    ]);
    const err = items.error || settings.error || trips.error || outfits.error;
    if (err) throw err;

    const catsFor = (owner) => {
      const row = (settings.data || []).find((r) => r.owner === owner);
      return row && Array.isArray(row.cats) && row.cats.length ? row.cats : null;
    };

    return {
      closets: {
        her: {
          items: (items.data || []).filter((r) => r.owner === "her").map(fromRow),
          cats: catsFor("her") || DEFAULT_CATS.her,
        },
        his: {
          items: (items.data || []).filter((r) => r.owner === "his").map(fromRow),
          cats: catsFor("his") || DEFAULT_CATS.his,
        },
      },
      trips: (trips.data || []).map((r) => r.data).filter(Boolean),
      outfits: (outfits.data || []).map((r) => r.data).filter(Boolean),
    };
  },

  addItems(items) {
    touch();
    return supa.from("items").insert(items.map(toRow));
  },
  updateItem(it) {
    touch();
    return supa.from("items").update({ owner: it.owner, cat: it.cat, loc: it.loc, name: it.name, img: it.img }).eq("id", it.id);
  },
  deleteItem(id) {
    touch();
    return supa.from("items").delete().eq("id", id);
  },
  saveCats(owner, cats) {
    touch();
    return supa.from("closet_settings").upsert({ owner, cats });
  },
  saveTrip(t) {
    touch();
    return supa.from("trips").upsert({ id: t.id, data: t, updated_at: new Date().toISOString() });
  },
  deleteTrip(id) {
    touch();
    return supa.from("trips").delete().eq("id", id);
  },
  saveOutfit(o) {
    touch();
    return supa.from("outfits").upsert({ id: o.id, data: o });
  },
  deleteOutfit(id) {
    touch();
    return supa.from("outfits").delete().eq("id", id);
  },
};

    loc: r.loc || "CUN",
    name: r.name || "",
    img: r.img || "",
    addedAt: r.created_at ? Date.parse(r.created_at) : 0,

}

function parseYMD(s) {
  const [y, m, d] = String(s).split("-").map(Number);
  return new Date(y, (m || 1) - 1, d || 1);
}
function toYMD(dt) {
  return `${dt.getFullYear()}-${String(dt.getMonth() + 1).padStart(2, "0")}-${String(
    dt.getDate()
  ).padStart(2, "0")}`;
}
const DOW = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
const MON = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];

function dayLabel(ymd) {
  const d = parseYMD(ymd);
  return DOW[d.getDay()].toUpperCase();
}
function dayNum(ymd) {
  const d = parseYMD(ymd);
  return `${String(d.getDate()).padStart(2, "0")}.${String(d.getMonth() + 1).padStart(2, "0")}`;
}
function rangeLabel(start, end) {
  if (!start) return "";
  const a = parseYMD(start);
  if (!end || end === start) return `${a.getDate()} ${MON[a.getMonth()]}`;
  const b = parseYMD(end);
  if (a.getMonth() === b.getMonth())
    return `${a.getDate()}–${b.getDate()} ${MON[a.getMonth()]}`;
  return `${a.getDate()} ${MON[a.getMonth()]} – ${b.getDate()} ${MON[b.getMonth()]}`;
}
function daysBetween(start, end) {
  const out = [];
  if (!start) return out;
  const a = parseYMD(start);
  const b = end ? parseYMD(end) : a;
  const cur = new Date(a);
  let guard = 0;
  while (cur <= b && guard < 90) {
    out.push(toYMD(cur));
    cur.setDate(cur.getDate() + 1);
    guard++;
  }
  return out;
}

/* A filename is only worth keeping if a person chose it. Camera and
   screenshot names are noise, so they start blank instead. */
function cleanName(filename) {
  const base = String(filename || "").replace(/\.[^.]+$/, "").replace(/[_-]+/g, " ").trim();
  if (!base) return "";
  if (/^(img|image|photo|pic|pxl|dsc|dscf|mvimg|screenshot|fullsizerender|untitled)[\s\d]*$/i.test(base)) return "";
  if (/^\d{4,}[\s\d]*$/.test(base)) return "";
  return base.slice(0, 40);
}

function imageFromFile(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onerror = () => reject(new Error("Could not read that file"));
    reader.onload = () => {
      const img = new Image();
      img.onerror = () => reject(new Error("That file isn't an image we can read"));
      img.onload = () => resolve(img);
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

/* Resizes a photo down to a sane storage size, keeping its true aspect
   ratio. Nothing here alters the pixels the camera actually captured. */
async function processPhoto(file, opts) {
  const { out = 380, margin = 0.05 } = opts || {};
  const img = await imageFromFile(file);

  const workMax = 800;
  const scale = Math.min(1, workMax / Math.max(img.width, img.height));
  const w = Math.max(1, Math.round(img.width * scale));
  const h = Math.max(1, Math.round(img.height * scale));

  const k = (out * (1 - margin * 2)) / Math.max(w, h);
  const dw = Math.max(1, Math.round(w * k));
  const dh = Math.max(1, Math.round(h * k));
  const pad = Math.round(out * margin);

  const canvas = document.createElement("canvas");
  canvas.width = dw + pad * 2;
  canvas.height = dh + pad * 2;
  const ctx = canvas.getContext("2d");
  ctx.drawImage(img, 0, 0, img.width, img.height, pad, pad, dw, dh);

  let data = null;
  try { data = canvas.toDataURL("image/webp", 0.8); } catch (e) { data = null; }
  if (!data || data.indexOf("image/webp") < 0) data = canvas.toDataURL("image/png");
  return { img: data };
}

/* Colour words a piece's name might carry, each with a rough hue (for

const COLOR_WORDS = {
  white: { s: 0.05, l: 0.97 },
  ivory: { s: 0.05, l: 0.94 },
  cream: { s: 0.05, l: 0.93 },

  gray: { s: 0.05, l: 0.50 },
  charcoal: { s: 0.05, l: 0.25 },
  black: { s: 0.05, l: 0.04 },

  red: { h: 0, s: 0.6, l: 0.5 },
  burgundy: { h: 350, s: 0.6, l: 0.5 },
  maroon: { h: 350, s: 0.6, l: 0.5 },
  wine: { h: 350, s: 0.6, l: 0.5 },
  pink: { h: 330, s: 0.6, l: 0.5 },
  magenta: { h: 320, s: 0.6, l: 0.5 },
  fuchsia: { h: 320, s: 0.6, l: 0.5 },
  purple: { h: 275, s: 0.6, l: 0.5 },
  violet: { h: 270, s: 0.6, l: 0.5 },
  lavender: { h: 265, s: 0.6, l: 0.5 },
  navy: { h: 225, s: 0.6, l: 0.5 },
  blue: { h: 215, s: 0.6, l: 0.5 },
  denim: { h: 210, s: 0.6, l: 0.5 },
  teal: { h: 180, s: 0.6, l: 0.5 },
  turquoise: { h: 175, s: 0.6, l: 0.5 },
  mint: { h: 150, s: 0.6, l: 0.5 },
  green: { h: 120, s: 0.6, l: 0.5 },
  olive: { h: 70, s: 0.6, l: 0.5 },
  mustard: { h: 48, s: 0.6, l: 0.5 },
  yellow: { h: 55, s: 0.6, l: 0.5 },
  gold: { h: 45, s: 0.6, l: 0.5 },
  orange: { h: 30, s: 0.6, l: 0.5 },
  coral: { h: 15, s: 0.6, l: 0.5 },
  rust: { h: 18, s: 0.6, l: 0.5 },
  terracotta: { h: 20, s: 0.6, l: 0.5 },
  brown: { h: 25, s: 0.6, l: 0.5 },
  chocolate: { h: 22, s: 0.6, l: 0.5 },
};
const COLOR_WORD_LIST = Object.keys(COLOR_WORDS).sort((a, b) => b.length - a.length);

/* Reads a colour straight off the name someone typed — "Black silk
   slip" sorts as black — rather than sampling the photo itself.
   Punctuation is flattened first so "Black, silk…" still matches. */
function hslFromName(name) {
  const cleaned = ` ${String(name || "").toLowerCase().replace(/[^a-z]+/g, " ")} `;
  for (const word of COLOR_WORD_LIST) {
    if (cleaned.includes(` ${word} `)) return COLOR_WORDS[word];
  }
  return null;
}

/* Whites, greys and blacks don't have a meaningful hue, so they'd
   otherwise scatter randomly through a hue sort. Bucket them first,
   darkest to lightest, then run the rest around the colour wheel. */
function colorSortKey(hsl) {
  if (!hsl) return [2, 0];
  const { h, s, l } = hsl;
  if (s < 0.15 || l < 0.06 || l > 0.95) return [0, l];
  return [1, h];
}
function compareColorKey(a, b) {
  return a[0] - b[0] || a[1] - b[1];
}

function approxSize(obj) {
  try {
    return JSON.stringify(obj).length;
  } catch (e) {
    return 0;
  }
}
function fmtBytes(n) {
  if (n < 1024) return `${n} B`;
  if (n < 1024 * 1024) return `${(n / 1024).toFixed(0)} KB`;
  return `${(n / 1024 / 1024).toFixed(1)} MB`;
}

/* ---- look board (moodboard per day) ----
   Pieces are sized by HEIGHT against a notional figure (--fig), not by
   width, so a source image's own aspect ratio can't make a shirt taller
   than a pair of trousers. Fractions approximate where each garment sits
   on a body: torso ~26%, waist-to-floor ~44%, foot ~9%. */
.rl-board {
  --fig: 300px;
  position: relative; background: var(--paper); border: 1px solid var(--rule-soft);
  padding: 12px 8px 14px; min-height: 96px;
}
.rl-board-stack { display: flex; flex-direction: column; align-items: center; }
.rl-board-row {
  display: flex; align-items: flex-start; justify-content: center; width: 100%;
}
.rl-board-item {
  background: none; border: 0; padding: 0; margin: 0;
  display: inline-block; width: auto; line-height: 0;
  position: relative; cursor: pointer;
}
.rl-board-item img {
  display: block; height: 100%; width: auto; max-width: 100%; object-fit: contain;
}
.rl-board-item:hover::after {
  content: "×"; position: absolute; top: -2px; right: -2px;
  width: 16px; height: 16px; background: var(--ink); color: var(--paper);
  border-radius: 50%; font-size: 10px; line-height: 16px; text-align: center; z-index: 6;
}

.rl-board-item[data-zone="outer"]       { height: calc(var(--fig) * 0.30); z-index: 1; }
.rl-board-item[data-zone="outerLong"]   { height: calc(var(--fig) * 0.40); z-index: 1; }
.rl-board-item[data-zone="top"]         { height: calc(var(--fig) * 0.26); z-index: 2; }
.rl-board-item[data-zone="dress"]       { height: calc(var(--fig) * 0.46); }
.rl-board-item[data-zone="bottomLong"]  { height: calc(var(--fig) * 0.44); }
.rl-board-item[data-zone="bottomShort"] { height: calc(var(--fig) * 0.24); }

/* A shoe's defining dimension is its length, not its height — sizing it
   by height renders it as a sliver. */
.rl-board-item[data-zone="shoes"] { width: calc(var(--fig) * 0.20); height: auto; }
.rl-board-item[data-zone="shoes"] img { width: 100%; height: auto; }

/* a top sitting in front of a jacket tucks well over its edge, and hangs
   slightly lower than the shoulder line */
.rl-board-item[data-layered="true"] {
  margin-left: calc(var(--fig) * -0.20);
  margin-top: calc(var(--fig) * 0.03);
}

.rl-board-mid   { margin-top: calc(var(--fig) * -0.015); }
.rl-board-feet  { margin-top: calc(var(--fig) * 0.015); }

.rl-board-accent {
  position: absolute; right: 5px;
  height: calc(var(--fig) * 0.15); z-index: 3;
}
.rl-board-empty {
  border: 1px dashed var(--rule); background: transparent;
  padding: 22px 10px; text-align: center; font-size: 10.5px; color: #B3A794;
}

.rl-pairnone {
  font-size: 11px; color: #B3A794; padding: 12px 0; letter-spacing: .02em;
}

/* ---- swipe deck ---- */
.rl-deck {

}

.rl-deckstamp.keep { left: 14px; background: var(--ink); color: var(--paper); }

/* ---- sheet / modal ---- */
.rl-scrim {
  position: fixed; inset: 0; background: rgba(20,20,15,.42); z-index: 60;
  display: flex; align-items: flex-end; justify-content: center;
}
@media (min-width: 700px) { .rl-scrim { align-items: center; } }
.rl-sheet {

/* ---- chips ---- */
.rl-chips { display: flex; gap: 6px; flex-wrap: wrap; }

/* ---- cards ---- */
.rl-card {
  background: var(--paper); border: 1px solid var(--rule);
  padding: 16px; width: 100%; text-align: left; display: block;
}

.rl-empty {
  border: 1px dashed var(--rule); background: transparent;
  padding: 34px 20px; text-align: center; color: var(--muted); font-size: 13px;
  line-height: 1.6;
}

.rl-packrow {
  display: flex; align-items: center; gap: 12px;
  padding: 9px 0; border-bottom: 1px solid var(--rule-soft);
}
.rl-packbox {
  width: 18px; height: 18px; border: 1px solid var(--ink); border-radius: 4px; background: var(--paper);
  flex: 0 0 auto; display: flex; align-items: center; justify-content: center;
  font-size: 11px; color: var(--paper);
}
.rl-packbox[data-on="true"] { background: var(--ink); }
.rl-packthumb {
  width: 34px; height: 34px; flex: 0 0 auto; background: var(--paper);
  border: 1px solid var(--rule-soft); display:flex; align-items:center; justify-content:center;
}
.rl-packthumb img { max-width: 92%; max-height: 92%; object-fit: contain; }

@media (prefers-reduced-motion: no-preference) {
  .rl-fade { animation: rlfade .18s ease-out; }
  @keyframes rlfade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
}
`;

/* ------------------------------------------------------------------ */
/*  small components                                                   */
/* ------------------------------------------------------------------ */

function Sheet({ title, eyebrow, onClose, children, footer }) {
  useEffect(() => {
    const onKey = (e) => e.key === "Escape" && onClose();
    window.addEventListener("keydown", onKey);
    return () => window.removeEventListener("keydown", onKey);
  }, [onClose]);
  return (
    <div className="rl-scrim" onMouseDown={(e) => e.target === e.currentTarget && onClose()}>
      <div className="rl-sheet rl-fade" role="dialog" aria-modal="true">
        <div className="rl-sheethead">
          <div>
            {eyebrow && <div className="rl-eyebrow" style={{ marginBottom: 3 }}>{eyebrow}</div>}
            <div className="rl-display" style={{ fontSize: 20 }}>{title}</div>
          </div>
          <button className="rl-btn quiet tiny" onClick={onClose}>Close</button>
        </div>
        <div className="rl-sheetbody">{children}</div>
        {footer && <div className="rl-sheetfoot">{footer}</div>}
      </div>
    </div>
  );
}

function Thumb({ item, onClick, selected, showOwner }) {
  return (
    <button
      className="rl-cell"
      data-sel={selected ? "true" : "false"}
      onClick={onClick}
      title={item.name || item.cat}
    >
      {item.img ? (
        <img src={item.img} alt={item.name || item.cat} loading="lazy" />
      ) : (
        <span className="rl-eyebrow">No image</span>
      )}
      {selected && <span className="rl-check">✓</span>}
      {item.loc === "NYC" && <span className="rl-locflag" title="New York">NY</span>}
      {showOwner && <span className="rl-owner">{OWNER_LABEL[item.owner]}</span>}
    </button>
  );
}

/* ------------------------------------------------------------------ */
/*  add pieces                                                         */
/* ------------------------------------------------------------------ */

function AddPieces({ owner: initialOwner, closets, setClosets, onClose, onAdd }) {
  const [owner, setOwner] = useState(initialOwner);
  const cats = closets[owner].cats;
  const [cat, setCat] = useState(cats[0] || "Other");
  const [loc, setLoc] = useState("CUN");
  const [newCat, setNewCat] = useState("");
  const [showCatAdd, setShowCatAdd] = useState(false);
  const [queue, setQueue] = useState([]); // {img, name}
  const [busy, setBusy] = useState("");
  const [err, setErr] = useState("");
  const fileRef = useRef(null);
  const inputId = useRef("rl-file-" + uid()).current;

  const switchOwner = (o) => {
    setOwner(o);
    const list = closets[o].cats;
    if (!list.includes(cat)) setCat(list[0] || "Other");
    setShowCatAdd(false);
    setNewCat("");
  };

  const addCategory = () => {
    const c = newCat.trim();
    if (!c) return;
    if (!cats.includes(c)) {
      setClosets((cs) => ({ ...cs, [owner]: { ...cs[owner], cats: [...cs[owner].cats, c] } }));
    }
    setCat(c);
    setNewCat("");
    setShowCatAdd(false);
  };

  const onFiles = async (e) => {
    const files = Array.from(e.target.files || []);
    if (!files.length) return;
    setBusy(`Preparing ${files.length} photo${files.length > 1 ? "s" : ""}…`);
    setErr("");
    const added = [];
    for (const f of files) {
      try {
        const r = await processPhoto(f, {});
        added.push({ img: r.img, name: cleanName(f.name) });
      } catch (e) {
        setErr(e.message);
      }
    }
    setBusy("");
    setQueue((q) => [...q, ...added]);
    if (fileRef.current) fileRef.current.value = "";
  };

  const commit = () => {
    if (!queue.length) return;
    onAdd(
      queue.map((q) => ({
        id: uid(),
        owner,
        cat,
        loc,
        name: q.name || "",
        img: q.img,
        addedAt: Date.now(),
      }))
    );
    onClose();
  };

  return (
    <Sheet
      title="Add pieces"
      eyebrow={`${OWNER_LABEL[owner]}'s closet · ${cat}`}
      onClose={onClose}
      footer={
        <>
          <span className="rl-mono" style={{ fontSize: 11, color: "var(--muted)", marginRight: "auto" }}>
            {queue.length} ready
          </span>
          <button className="rl-btn ghost" onClick={onClose}>Cancel</button>
          <button className="rl-btn" onClick={commit} disabled={!queue.length || !!busy}>
            Add {queue.length || ""}
          </button>
        </>
      }
    >
      <div className="rl-eyebrow" style={{ marginBottom: 8 }}>Whose closet</div>
      <div className="rl-chips" style={{ marginBottom: 22 }}>
        {["her", "his"].map((o) => (
          <button key={o} className="rl-chip" data-on={owner === o ? "true" : "false"} onClick={() => switchOwner(o)}>
            {OWNER_LABEL[o]}
          </button>
        ))}
      </div>

      <div className="rl-eyebrow" style={{ marginBottom: 8 }}>Category</div>
      <div className="rl-chips" style={{ marginBottom: 10 }}>
        {cats.map((c) => (
          <button key={c} className="rl-chip" data-on={cat === c ? "true" : "false"} onClick={() => setCat(c)}>
            {c}
          </button>
        ))}
        {!showCatAdd && (
          <button className="rl-chip" onClick={() => setShowCatAdd(true)}>+ New</button>
        )}
      </div>

      {showCatAdd && (
        <div style={{ display: "flex", gap: 8, marginBottom: 18, maxWidth: 380 }}>
          <input
            className="rl-field"
            autoFocus
            value={newCat}
            placeholder={`New category for ${OWNER_LABEL[owner]}`}
            onChange={(e) => setNewCat(e.target.value)}
            onKeyDown={(e) => {
              if (e.key === "Enter") addCategory();
              if (e.key === "Escape") { setShowCatAdd(false); setNewCat(""); }
            }}
          />
          <button className="rl-btn" onClick={addCategory} disabled={!newCat.trim()}>Add</button>
          <button className="rl-btn ghost" onClick={() => { setShowCatAdd(false); setNewCat(""); }}>Cancel</button>
        </div>
      )}

      <div className="rl-eyebrow" style={{ marginBottom: 8 }}>Location</div>
      <div className="rl-chips" style={{ marginBottom: 22 }}>
        {LOCS.map((l) => (
          <button key={l} className="rl-chip" data-on={loc === l ? "true" : "false"} onClick={() => setLoc(l)}>
            {l}
          </button>
        ))}
      </div>

      <div className="rl-eyebrow" style={{ margin: "22px 0 10px" }}>Photos</div>

      <input
        ref={fileRef}
        id={inputId}
        className="rl-fileinput"
        type="file"
        accept="image/*"
        multiple
        onChange={onFiles}
      />
      <label htmlFor={inputId} className="rl-filebtn">
        Choose photos
      </label>

      <div style={{ fontSize: 12, color: "var(--muted)", marginTop: 10, lineHeight: 1.55 }}>
        Pick as many as you like at once. On iPhone, tap <strong>Photo Library</strong> in the menu
        Safari shows — it can't be skipped, but it's always the first option.
      </div>

      {busy && <div className="rl-eyebrow" style={{ marginTop: 12 }}>{busy}</div>}
      {err && <div style={{ marginTop: 12, fontSize: 12, color: "var(--accent)" }}>{err}</div>}

      {queue.length > 0 && (
        <>

                <span className="rl-queuename">

                    className="rl-field"
                    value={q.name}
                    placeholder="Black silk slip, Toteme blazer…"

                      setQueue((cur) => cur.map((x, j) => (j === i ? { ...x, name: e.target.value } : x)))
                    }

                  className="rl-queuedrop"

/* Works out where a piece sits on the body, from its category.
   Distinguishes long from short so trousers aren't drawn the size of
   shorts. Anything unrecognised is treated as a top rather than dropped. */
function zoneOf(item) {
  const c = ((item && item.cat) || "").toLowerCase();
  const n = ((item && item.name) || "").toLowerCase();
  const both = c + " " + n;
  if (/coat|parka|trench|puffer/.test(both)) return "outerLong";
  if (/outerwear|jacket|blazer|cardigan/.test(c)) return "outer";
  if (/dress|gown|jumpsuit/.test(c)) return "dress";
  if (/shoe|boot|sandal|sneaker|heel|loafer|flat|mule|trainer/.test(c)) return "shoes";
  if (/bag|accessor|jewel|hat|belt|scarf|sunglass|clutch/.test(c)) return "accent";
  if (/short|skirt|swim|bikini|bathing|trunk/.test(both)) return "bottomShort";
  if (/bottom|trouser|jean|pant|legging|chino|slack/.test(c)) return "bottomLong";
  return "top";
}

/* Which pieces best represent a look at thumbnail size. */
const MOSAIC_ORDER = ["dress", "top", "outer", "outerLong", "bottomLong", "bottomShort", "shoes", "accent"];

const IS_OUTER = (z) => z === "outer" || z === "outerLong";
const IS_MID = (z) => z === "dress" || z === "bottomLong" || z === "bottomShort";

function LookBoard({ items, onRemove, empty = "Nothing yet", fig }) {
  if (!items.length) return <div className="rl-board-empty">{empty}</div>;

  const zoned = items.map((it) => ({ it, z: zoneOf(it) }));
  const outer = zoned.filter((x) => IS_OUTER(x.z));
  const tops = zoned.filter((x) => x.z === "top");
  const mids = zoned.filter((x) => IS_MID(x.z));
  const feet = zoned.filter((x) => x.z === "shoes");
  const accents = zoned.filter((x) => x.z === "accent");

  const piece = ({ it, z }, extra) => (
    <button
      key={it.id}
      className="rl-board-item"
      data-zone={z}
      onClick={() => onRemove && onRemove(it.id)}
      title={it.name || it.cat}
      {...extra}
    >
      {it.img ? <img src={it.img} alt={it.name || it.cat} loading="lazy" /> : null}
    </button>
  );

  return (
    <div className="rl-board" style={fig ? { "--fig": fig + "px" } : undefined}>
      <div className="rl-board-stack">
        {(outer.length > 0 || tops.length > 0) && (
          <div className="rl-board-row">
            {outer.map((x) => piece(x))}
            {tops.map((x, i) =>
              piece(x, outer.length > 0 && i === 0 ? { "data-layered": "true" } : {})
            )}
          </div>
        )}
        {mids.length > 0 && (
          <div className="rl-board-row rl-board-mid">{mids.map((x) => piece(x))}</div>
        )}
        {feet.length > 0 && (
          <div className="rl-board-row rl-board-feet">{feet.map((x) => piece(x))}</div>
        )}
      </div>
      {accents.map((x, i) => (
        <button
          key={x.it.id}
          className="rl-board-item rl-board-accent"
          onClick={() => onRemove && onRemove(x.it.id)}
          title={x.it.name || x.it.cat}
          style={{ bottom: 10 + i * 34 }}
        >
          {x.it.img ? <img src={x.it.img} alt={x.it.name || x.it.cat} loading="lazy" /> : null}
        </button>
      ))}
    </div>
  );
}

function Carousel({ items, onPick, selected, size = 124 }) {
  const ref = useRef(null);
  const nudge = (dir) => {
    const el = ref.current;
    if (el) el.scrollBy({ left: dir * (size + 1) * 2, behavior: "smooth" });
  };
  return (
    <div className="rl-carwrap">
      <button className="rl-arrow l" onClick={() => nudge(-1)} aria-label="Back">‹</button>
      <div className="rl-car" ref={ref} style={{ "--slide": size + "px" }}>
        {items.map((it) => (
          <button
            key={it.id}
            className="rl-slide"
            data-sel={selected && selected.includes(it.id) ? "true" : "false"}
            onClick={() => onPick(it)}
            title={it.name || it.cat}
          >
            {it.img ? <img src={it.img} alt={it.name || it.cat} loading="lazy" /> : <span className="rl-eyebrow">No image</span>}
            {it.loc === "NYC" && <span className="rl-locflag" title="New York">NY</span>}
          </button>
        ))}
      </div>
      <button className="rl-arrow r" onClick={() => nudge(1)} aria-label="Forward">›</button>
    </div>
  );
}

function Closet({ closets, setClosets, openItem, openAdd }) {
  const [owner, setOwner] = useState("her");
  const [layout, setLayout] = useState("carousel");
  const [locFilter, setLocFilter] = useState("all");
  const closet = closets[owner];
  const [newCat, setNewCat] = useState("");
  const [showCatAdd, setShowCatAdd] = useState(false);
  const [note, setNote] = useState("");

  const visibleItems = useMemo(
    () => (locFilter === "all" ? closet.items : closet.items.filter((it) => (it.loc || "CUN") === locFilter)),
    [closet.items, locFilter]
  );

  /* Sorted by colour within each rail, read off each piece's name —
     whites/greys/blacks first (darkest to lightest), then the rest
     around the colour wheel. Anything without a colour word in its
     name sits at the end. */
  const grouped = useMemo(() => {
    const m = {};
    closet.cats.forEach((c) => (m[c] = []));
    visibleItems.forEach((it) => {
      if (!m[it.cat]) m[it.cat] = [];
      m[it.cat].push(it);
    });
    Object.keys(m).forEach((c) => {
      m[c] = [...m[c]].sort((a, b) =>
        compareColorKey(colorSortKey(hslFromName(a.name)), colorSortKey(hslFromName(b.name)))
      );
    });
    return m;
  }, [closet.cats, visibleItems]);

  const total = visibleItems.length;

  const addCat = () => {
    const c = newCat.trim();
    if (!c || closet.cats.includes(c)) return;
    setClosets((cs) => ({ ...cs, [owner]: { ...cs[owner], cats: [...cs[owner].cats, c] } }));
    setNewCat("");
    setShowCatAdd(false);
  };

  const renderRow = (c, items) => (
    <section key={c} style={{ marginBottom: 34 }}>
      <div className="rl-railhead">
        <span className="rl-railname">{c}</span>
        <span className="rl-raildots" />
        <span className="rl-railcount rl-mono">{String(items.length).padStart(2, "0")}</span>
      </div>
      {layout === "carousel" ? (
        <Carousel items={items} onPick={openItem} />
      ) : (
        <div className="rl-rack">
          {items.map((it) => (
            <Thumb key={it.id} item={it} onClick={() => openItem(it)} />
          ))}
        </div>
      )}
    </section>
  );

  return (
    <div>
      <div style={{ display: "flex", alignItems: "flex-end", justifyContent: "space-between", gap: 16, flexWrap: "wrap", marginBottom: 24 }}>
        <div>
          <div className="rl-eyebrow" style={{ marginBottom: 6 }}>Closet</div>
          <div className="rl-chips">
            {["her", "his"].map((o) => (
              <button key={o} className="rl-chip" data-on={owner === o ? "true" : "false"} onClick={() => setOwner(o)}>
                {OWNER_LABEL[o]}
              </button>
            ))}
          </div>
        </div>
        <div style={{ display: "flex", gap: 8, alignItems: "center", flexWrap: "wrap" }}>
          <div className="rl-chips">
            {["all", ...LOCS].map((l) => (
              <button key={l} className="rl-chip" data-on={locFilter === l ? "true" : "false"} onClick={() => setLocFilter(l)}>
                {l === "all" ? "All" : l}
              </button>
            ))}
          </div>
          <div className="rl-chips">
            {[["carousel", "Carousel"], ["grid", "Grid"]].map(([k, l]) => (
              <button key={k} className="rl-chip" data-on={layout === k ? "true" : "false"} onClick={() => setLayout(k)}>
                {l}
              </button>
            ))}
          </div>
          <span className="rl-mono" style={{ fontSize: 11, color: "var(--muted)" }}>
            {String(total).padStart(3, "0")}
          </span>
          <button className="rl-btn" onClick={() => openAdd(owner)}>Add pieces</button>
        </div>
      </div>

      {total === 0 && (
        <div className="rl-empty">
          {closet.items.length === 0 ? (
            <>
              {OWNER_LABEL[owner]}'s closet is empty.
              <br />
              Add pieces by uploading photos from your phone.
            </>
          ) : (
            <>Nothing filed under {locFilter}.</>
          )}
        </div>
      )}

      {closet.cats.map((c) => {
        const items = grouped[c] || [];
        if (!items.length) return null;
        return renderRow(c, items);
      })}

      {Object.keys(grouped)
        .filter((c) => !closet.cats.includes(c) && grouped[c].length)
        .map((c) => renderRow(c, grouped[c]))}

      <div style={{ marginTop: 30, borderTop: "1px solid var(--rule)", paddingTop: 14, display: "flex", gap: 8, alignItems: "center", flexWrap: "wrap" }}>
        {showCatAdd ? (
          <div style={{ display: "flex", gap: 8, maxWidth: 380 }}>
            <input
              className="rl-field"
              autoFocus
              value={newCat}
              placeholder="New category name"
              onChange={(e) => setNewCat(e.target.value)}
              onKeyDown={(e) => e.key === "Enter" && addCat()}
            />
            <button className="rl-btn" onClick={addCat}>Add</button>
            <button className="rl-btn ghost" onClick={() => setShowCatAdd(false)}>Cancel</button>
          </div>
        ) : (
          <>
            <button className="rl-btn quiet tiny" onClick={() => setShowCatAdd(true)}>
              New category
            </button>
            {JSON.stringify(closet.cats) !== JSON.stringify(DEFAULT_CATS[owner]) && (
              <button
                className="rl-btn quiet tiny"
                onClick={() => {
                  setClosets((cs) => ({ ...cs, [owner]: { ...cs[owner], cats: DEFAULT_CATS[owner] } }));
                  setNote("Categories reset. Any piece filed elsewhere still shows, listed under its own heading.");
                }}
              >
                Use standard categories
              </button>
            )}
          </>
        )}
      </div>
      {note && (
        <div style={{ fontSize: 11.5, color: "var(--muted)", marginTop: 8, lineHeight: 1.5 }}>
          {note}
        </div>
      )}
    </div>
  );
}

function Picker({ closets, outfits, allItems, title, eyebrow, initial = [], lockOwner, onClose, onConfirm }) {
  const [owner, setOwner] = useState(lockOwner || "her");
  const [sel, setSel] = useState(initial);
  const [tab, setTab] = useState("closet");
  const closet = closets[owner];

  const toggle = (id) => setSel((s) => (s.includes(id) ? s.filter((x) => x !== id) : [...s, id]));

  const grouped = useMemo(() => {
    const m = {};
    closet.items.forEach((it) => {
      (m[it.cat] = m[it.cat] || []).push(it);
    });
    return m;
  }, [closet]);

  const ownerOutfits = outfits.filter((o) => o.owner === owner);

  /* ---- deck ---- */
  const [deckCat, setDeckCat] = useState("all");
  const [deckIdx, setDeckIdx] = useState(0);
  const [drag, setDrag] = useState({ x: 0, y: 0, live: false });
  const dragFrom = useRef(null);

  const deckList = useMemo(
    () => closet.items.filter((it) => deckCat === "all" || it.cat === deckCat),
    [closet.items, deckCat]
  );

  useEffect(() => {
    setDeckIdx(0);
    setDrag({ x: 0, y: 0, live: false });
  }, [owner, deckCat, tab]);

  const decide = (keep) => {
    const it = deckList[deckIdx];
    if (it) {
      setSel((s) =>
        keep ? (s.includes(it.id) ? s : [...s, it.id]) : s.filter((x) => x !== it.id)
      );
    }
    setDeckIdx((i) => i + 1);
    setDrag({ x: 0, y: 0, live: false });
  };

  const onDown = (e) => {
    dragFrom.current = { x: e.clientX, y: e.clientY };
    try { e.currentTarget.setPointerCapture(e.pointerId); } catch (err) {}
    setDrag({ x: 0, y: 0, live: true });
  };
  const onMove = (e) => {
    if (!dragFrom.current) return;
    setDrag({ x: e.clientX - dragFrom.current.x, y: e.clientY - dragFrom.current.y, live: true });
  };
  const onUp = (e) => {
    if (!dragFrom.current) return;
    const dx = e.clientX - dragFrom.current.x;
    dragFrom.current = null;
    if (Math.abs(dx) > 84) decide(dx > 0);
    else setDrag({ x: 0, y: 0, live: false });
  };

  return (
    <Sheet
      title={title}
      eyebrow={eyebrow}
      onClose={onClose}
      footer={
        <>
          <span className="rl-mono" style={{ fontSize: 11, color: "var(--muted)", marginRight: "auto" }}>
            {sel.length} selected
          </span>
          <button className="rl-btn ghost" onClick={onClose}>Cancel</button>
          <button className="rl-btn" onClick={() => { onConfirm(sel); onClose(); }}>Done</button>
        </>
      }
    >
      <div style={{ display: "flex", gap: 8, marginBottom: 18, flexWrap: "wrap" }}>
        {lockOwner ? (
          <span className="rl-eyebrow" style={{ alignSelf: "center" }}>
            {OWNER_LABEL[lockOwner]}'s closet
          </span>
        ) : (
          <div className="rl-chips">
            {["her", "his"].map((o) => (
              <button key={o} className="rl-chip" data-on={owner === o ? "true" : "false"} onClick={() => setOwner(o)}>
                {OWNER_LABEL[o]}
              </button>
            ))}
          </div>
        )}
        <div className="rl-chips" style={{ marginLeft: "auto" }}>
          {[["closet", "Pieces"], ["outfits", "Outfits"], ["deck", "Deck"]].map(([k, l]) => (
            <button key={k} className="rl-chip" data-on={tab === k ? "true" : "false"} onClick={() => setTab(k)}>
              {l}
            </button>
          ))}
        </div>
      </div>

      {tab === "closet" && (
        <>
          {closet.items.length === 0 && <div className="rl-empty">Nothing in this closet yet.</div>}
          {Object.keys(grouped).map((c) => (
            <section key={c} style={{ marginBottom: 24 }}>
              <div className="rl-railhead">
                <span className="rl-railname">{c}</span>
                <span className="rl-raildots" />
                <span className="rl-railcount rl-mono">{String(grouped[c].length).padStart(2, "0")}</span>
              </div>
              <div className="rl-rack">
                {grouped[c].map((it) => (
                  <Thumb key={it.id} item={it} selected={sel.includes(it.id)} onClick={() => toggle(it.id)} />
                ))}
              </div>
            </section>
          ))}
        </>
      )}

      {tab === "deck" && (() => {
        const cats = Array.from(new Set(closet.items.map((i) => i.cat)));
        const cur = deckList[deckIdx];
        const next = deckList[deckIdx + 1];
        const after = deckList[deckIdx + 2];
        const dx = drag.x;
        const stamp = dx > 40 ? "keep" : dx < -40 ? "skip" : null;

        return (
          <>
            <div className="rl-chips" style={{ marginBottom: 14 }}>
              <button className="rl-chip" data-on={deckCat === "all" ? "true" : "false"} onClick={() => setDeckCat("all")}>
                Everything
              </button>
              {cats.map((c) => (
                <button key={c} className="rl-chip" data-on={deckCat === c ? "true" : "false"} onClick={() => setDeckCat(c)}>
                  {c}
                </button>
              ))}
            </div>

            {deckList.length === 0 ? (
              <div className="rl-empty">Nothing here to deal. Try another category.</div>
            ) : !cur ? (
              <div className="rl-empty" style={{ padding: "46px 20px" }}>
                That's the whole {deckCat === "all" ? "closet" : deckCat.toLowerCase()}.
                <br />
                <span className="rl-mono" style={{ fontSize: 13, color: "var(--ink)" }}>
                  {sel.length} pieces in the look
                </span>
                <br />
                <button className="rl-btn ghost tiny" style={{ marginTop: 14 }} onClick={() => setDeckIdx(0)}>
                  Deal again
                </button>
              </div>
            ) : (
              <>
                <div className="rl-deck">
                  <span className="rl-deckcount rl-mono">
                    {deckIdx + 1} / {deckList.length}
                  </span>

                  {after && (
                    <div className="rl-deckcard" style={{ transform: "rotate(-3.5deg) translateX(-8px)", opacity: 0.3 }} />
                  )}
                  {next && (
                    <div className="rl-deckcard" style={{ transform: "rotate(2deg) translateX(5px)", opacity: 0.55 }} />
                  )}

                  <div
                    className="rl-deckcard top"
                    onPointerDown={onDown}
                    onPointerMove={onMove}
                    onPointerUp={onUp}
                    onPointerCancel={onUp}
                    style={{
                      transform: `translate(${dx}px, ${drag.y * 0.25}px) rotate(${dx / 20}deg)`,
                      transition: drag.live ? "none" : "transform .18s ease-out",
                    }}
                  >
                    {stamp === "keep" && <span className="rl-deckstamp keep">In the look</span>}
                    {stamp === "skip" && <span className="rl-deckstamp skip">Skip</span>}
                    <div className="rl-deckart">
                      {cur.img ? <img src={cur.img} alt="" draggable="false" /> : <span className="rl-eyebrow">No image</span>}
                    </div>
                    <div className="rl-deckcap">
                      <div style={{ fontSize: 14, fontWeight: 600, lineHeight: 1.3 }}>
                        {cur.name || cur.cat}
                      </div>
                      <div className="rl-eyebrow" style={{ marginTop: 4 }}>
                        {OWNER_LABEL[cur.owner]} · {cur.cat}
                        {sel.includes(cur.id) ? " · already in" : ""}
                      </div>
                    </div>
                  </div>
                </div>

                <div className="rl-deckbar">
                  <button className="rl-deckbtn" onClick={() => decide(false)} aria-label="Skip">✕</button>
                  <button
                    className="rl-deckbtn small"
                    onClick={() => setDeckIdx((i) => Math.max(0, i - 1))}
                    disabled={deckIdx === 0}
                    aria-label="Back one"
                  >
                    ↺
                  </button>
                  <button className="rl-deckbtn fill" onClick={() => decide(true)} aria-label="Add to look">✓</button>
                </div>
                <div style={{ textAlign: "center", fontSize: 11, color: "var(--muted)", marginTop: 8 }}>
                  Drag the card, or use the buttons. {sel.length} in the look so far.
                </div>
              </>
            )}
          </>
        );
      })()}

      {tab === "outfits" && (
        <>
          {ownerOutfits.length === 0 && (
            <div className="rl-empty">No saved outfits for {OWNER_LABEL[owner]} yet. Build one under Outfits.</div>
          )}
          {ownerOutfits.map((o) => {
            const pieces = o.items.map((id) => allItems[id]).filter(Boolean);
            const allIn = pieces.length > 0 && pieces.every((p) => sel.includes(p.id));
            return (
              <div key={o.id} style={{ marginBottom: 20 }}>
                <div className="rl-railhead">
                  <span className="rl-railname">{o.name}</span>
                  <span className="rl-raildots" />
                  <button
                    className="rl-btn ghost tiny"
                    onClick={() =>
                      setSel((s) =>
                        allIn
                          ? s.filter((id) => !o.items.includes(id))
                          : Array.from(new Set([...s, ...o.items]))
                      )
                    }
                  >

/* Builds the weeks of a month as a Monday-first grid, including the
   leading and trailing days that fill out the first and last rows. */
function monthMatrix(year, month) {
  const first = new Date(year, month, 1);
  const startOffset = (first.getDay() + 6) % 7; // Monday = 0
  const total = new Date(year, month + 1, 0).getDate();
  const rows = Math.ceil((startOffset + total) / 7);
  const weeks = [];
  const cur = new Date(year, month, 1 - startOffset);
  for (let w = 0; w < rows; w++) {
    const row = [];
    for (let d = 0; d < 7; d++) {
      row.push(new Date(cur));
      cur.setDate(cur.getDate() + 1);
    }
    weeks.push(row);
  }
  return weeks;
}

const MONTH_FULL = ["January","February","March","April","May","June",
                    "July","August","September","October","November","December"];
const DOW_SHORT = ["Mo", "Tu", "We", "Th", "Fr", "Sa", "Su"];

function TripCalendar({ trips, allItems, onOpen }) {
  const today = new Date();
  const todayKey = toYMD(today);
  const [selected, setSelected] = useState(null);

  /* open on the month of the next trip, else the most recent, else now */
  const initial = useMemo(() => {
    const upcoming = trips
      .filter((t) => t.end >= todayKey)
      .sort((a, b) => (a.start < b.start ? -1 : 1))[0];
    const fallback = trips.slice().sort((a, b) => (a.start < b.start ? 1 : -1))[0];
    const anchor = upcoming || fallback;
    const d = anchor ? parseYMD(anchor.start) : today;
    return { y: d.getFullYear(), m: d.getMonth() };
  }, [trips, todayKey]);

  const [cursor, setCursor] = useState(initial);
  const weeks = monthMatrix(cursor.y, cursor.m);

  const shift = (n) => {
    const d = new Date(cursor.y, cursor.m + n, 1);
    setCursor({ y: d.getFullYear(), m: d.getMonth() });
  };

  /* every day of every trip, keyed by date */
  const byDate = useMemo(() => {
    const m = {};
    trips.forEach((t) => {
      t.days.forEach((d) => {
        (m[d.date] = m[d.date] || []).push({ trip: t, day: d });
      });
    });
    return m;
  }, [trips]);

  const monthTrips = trips.filter((t) => {
    const s = parseYMD(t.start), e = parseYMD(t.end || t.start);
    const a = new Date(cursor.y, cursor.m, 1), b = new Date(cursor.y, cursor.m + 1, 0);
    return s <= b && e >= a;
  });

  return (
    <div>
      <div className="rl-calbar">
        <button className="rl-btn quiet tiny" onClick={() => shift(-1)} aria-label="Previous month">‹</button>
        <span className="rl-calmonth">
          {MONTH_FULL[cursor.m]} {cursor.y}
        </span>
        <button className="rl-btn quiet tiny" onClick={() => shift(1)} aria-label="Next month">›</button>
        <button
          className="rl-btn quiet tiny"
          style={{ marginLeft: "auto" }}
          onClick={() => setCursor({ y: today.getFullYear(), m: today.getMonth() })}
        >
          Today
        </button>
      </div>

      <div className="rl-caldow">
        {DOW_SHORT.map((d) => <span key={d}>{d}</span>)}
      </div>

      <div className="rl-calgrid">
        {weeks.map((week, wi) =>
          week.map((date, di) => {
            const key = toYMD(date);
            const outside = date.getMonth() !== cursor.m;
            const entries = byDate[key] || [];
            const has = entries.length > 0;
            return (
              <button
                key={key + wi + di}
                className="rl-calcell"
                data-out={outside ? "true" : "false"}
                data-trip={has ? "true" : "false"}
                data-sel={selected === key ? "true" : "false"}
                onClick={() => has && setSelected(selected === key ? null : key)}
                title={has ? entries.map((e) => e.trip.name).join(", ") : ""}
              >
                <span className="rl-caldate">
                  {key === todayKey ? (
                    <span className="rl-caltoday">{date.getDate()}</span>
                  ) : (
                    date.getDate()
                  )}
                </span>

                {entries.map(({ trip, day }, i) => {
                  const isStart = trip.start === key;
                  const showName = isStart || di === 0;
                  return (
                    <span
                      key={trip.id + i}
                      className="rl-calband"
                      data-cont={isStart ? "false" : "true"}
                    >
                      {showName ? trip.name : "·"}
                    </span>
                  );
                })}

                {has && (() => {
                  const worn = [];
                  entries.forEach(({ day }) =>
                    day.slots.forEach((id) => {
                      const it = allItems[id];
                      if (it && !worn.some((w) => w.id === it.id)) worn.push(it);
                    })
                  );
                  if (!worn.length) {
                    return (
                      <span className="rl-caldots">
                        {entries.map(({ trip }, i) => (
                          <span key={trip.id + "d" + i} className="rl-caldot" />
                        ))}
                      </span>
                    );
                  }
                  const hero = worn
                    .slice()
                    .sort((a, b) => MOSAIC_ORDER.indexOf(zoneOf(a)) - MOSAIC_ORDER.indexOf(zoneOf(b)))
                    .slice(0, 4);
                  return (
                    <span className="rl-calmosaic" data-one={hero.length === 1 ? "true" : "false"}>
                      {hero.map((it) => (
                        <span key={it.id} className="rl-calthumb">
                          {it.img ? <img src={it.img} alt="" loading="lazy" /> : null}
                        </span>
                      ))}
                    </span>
                  );
                })()}
              </button>
            );
          })
        )}
      </div>

      {(() => {
        const entries = selected ? (byDate[selected] || []) : [];
        if (!selected || !entries.length) {
          return (
            <div className="rl-callegend">
              <span className="rl-caldot" /> a day with no look yet · tap any day to see it
            </div>
          );
        }
        return (
          <div className="rl-calday">
            {entries.map(({ trip, day }) => {
              const worn = day.slots.map((id) => allItems[id]).filter(Boolean);
              const her = worn.filter((it) => it.owner === "her");
              const his = worn.filter((it) => it.owner === "his");
              return (
                <div key={trip.id + day.id} style={{ marginBottom: 8 }}>
                  <div className="rl-caldayhead">
                    <span className="rl-display" style={{ fontSize: 19 }}>{trip.name}</span>
                    <span className="rl-eyebrow">
                      {dayLabel(day.date)} {dayNum(day.date)}
                    </span>
                    <button
                      className="rl-btn ghost tiny"
                      style={{ marginLeft: "auto" }}
                      onClick={() => onOpen(trip.id)}
                    >
                      Open trip
                    </button>
                  </div>

                  {day.events.length > 0 && (
                    <div style={{ display: "flex", gap: 6, flexWrap: "wrap", marginBottom: 12 }}>
                      {day.events.map((ev, i) => (
                        <span
                          key={i}
                          style={{
                            background: "var(--tag)", color: "var(--tag-ink)",
                            fontSize: 11, padding: "4px 10px", borderRadius: 999,
                          }}
                        >
                          {ev}
                        </span>
                      ))}
                    </div>
                  )}

                  {worn.length === 0 ? (
                    <div className="rl-board-empty">
                      Nothing planned for this day yet.
                    </div>
                  ) : (
                    <div className="rl-caldaylooks">
                      {[["her", her], ["his", his]].map(([o, list]) =>
                        list.length ? (
                          <div key={o}>
                            <div className="rl-eyebrow" style={{ marginBottom: 6 }}>
                              {OWNER_LABEL[o]}
                            </div>
                            <LookBoard items={list} fig={230} />
                          </div>
                        ) : null
                      )}
                    </div>
                  )}
                </div>
              );
            })}
          </div>
        );
      })()}

      {monthTrips.length > 0 && (
        <div style={{ marginTop: 24 }}>
          {monthTrips.map((t) => {
            const planned = t.days.filter((d) => d.slots.length).length;
            return (
              <button
                key={t.id}
                className="rl-packrow"
                style={{ width: "100%", background: "none", border: 0, borderBottom: "1px solid var(--rule-soft)", textAlign: "left" }}
                onClick={() => onOpen(t.id)}
              >
                <span style={{ flex: 1, fontSize: 14 }}>{t.name}</span>
                <span className="rl-mono" style={{ fontSize: 10, color: "var(--muted)" }}>
                  {rangeLabel(t.start, t.end)} · {planned}/{t.days.length} dressed
                </span>
              </button>
            );
          })}
        </div>
      )}
    </div>
  );
}

                    onClick={() => setPicking({ dayId: d.id })}
                  >
                    {d.slots.length ? "Edit look" : "+ Build look"}
                  </button>
                  {d.slots.length > 0 && (
                    <div style={{ fontSize: 10, color: "var(--muted)", marginTop: 6, textAlign: "center" }}>
                      Tap a piece to pull it out
                    </div>
                  )}
                </div>

                <button
                  className="rl-btn quiet tiny"
                  style={{ marginTop: 14, width: "100%", borderColor: "transparent" }}
                  onClick={() => removeDay(d.id)}
                >
                  Remove day
                </button>
              </div>
            ))}
          </div>

          <div style={{ marginTop: 22, display: "flex", gap: 8 }}>
            <button className="rl-btn ghost" onClick={addDay}>Add a day</button>
            {confirmDel ? (
              <>
                <span style={{ fontSize: 12, color: "var(--muted)", alignSelf: "center", marginLeft: "auto" }}>
                  Delete {trip.name} and its plan?
                </span>
                <button className="rl-btn ghost" onClick={() => setConfirmDel(false)}>Keep</button>
                <button className="rl-btn" onClick={() => { deleteTrip(trip.id); onBack(); }}>Delete</button>
              </>
            ) : (
              <button className="rl-btn quiet" style={{ marginLeft: "auto" }} onClick={() => setConfirmDel(true)}>
                Delete trip
              </button>
            )}
          </div>
        </>
      )}

      {tab === "pair" && (
        <div style={{ marginTop: 24, maxWidth: 760 }}>
          <div className="rl-pair">
            {trip.days.map((d) => {
              const byOwner = { her: [], his: [] };
              d.slots.forEach((id) => {
                const it = allItems[id];
                if (it && byOwner[it.owner]) byOwner[it.owner].push(it);
              });
              const hasEvent = d.events.length > 0;
              return (
                <div key={d.id} className="rl-pairday">
                  <div className="rl-pairbar" data-event={hasEvent ? "true" : "false"}>
                    <span className="d">{dayLabel(d.date)}</span>
                    {hasEvent && <span className="e">{d.events.join(" · ")}</span>}
                    <span className="n mono">{dayNum(d.date)}</span>
                  </div>
                  <div className="rl-paircols">
                    {["her", "div", "his"].map((o) =>
                      o === "div" ? (
                        <div key="div" className="rl-pairdiv" />
                      ) : (
                        <div key={o} className="rl-paircol">
                          <div className="rl-pairwho">
                            <span>{OWNER_LABEL[o]}</span>
                            <button
                              className="rl-btn ghost tiny"
                              style={{ padding: "3px 7px", fontSize: 9 }}
                              onClick={() => setPicking({ dayId: d.id, owner: o })}
                            >
                              {byOwner[o].length ? "Edit" : "Dress"}
                            </button>
                          </div>
                          {byOwner[o].length === 0 ? (
                            <div className="rl-pairnone">Not planned</div>
                          ) : (
                            <LookBoard
                              items={byOwner[o]}
                              fig={250}
                              onRemove={(id) => setDay(d.id, { slots: d.slots.filter((x) => x !== id) })}
                            />
                          )}
                        </div>
                      )
                    )}
                  </div>
                </div>
              );
            })}
          </div>
          {trip.days.length === 0 && (
            <div className="rl-empty">No days on this trip yet. Add one under Days.</div>
          )}
          <div style={{ fontSize: 11, color: "var(--muted)", marginTop: 12 }}>
            Tap a piece to pull it out. Days with a note are marked in yellow.
          </div>
        </div>
      )}

      {tab === "packing" && (
        <div style={{ marginTop: 24, maxWidth: 620 }}>
          {pieceIds.length === 0 ? (
            <div className="rl-empty">
              Nothing assigned yet. Build looks under Days and the packing list writes itself.
            </div>
          ) : (
            <>
              <div style={{ display: "flex", justifyContent: "space-between", marginBottom: 18 }}>
                <span className="rl-eyebrow">{packedCount} of {pieceIds.length} packed</span>
                <button
                  className="rl-btn quiet tiny"
                  onClick={() => updateTrip({ ...trip, packed: {} })}
                >
                  Reset
                </button>
              </div>
              {Object.keys(packing).sort().map((key) => {
                const [owner, cat] = key.split("|");
                return (
                  <section key={key} style={{ marginBottom: 26 }}>
                    <div className="rl-railhead">
                      <span className="rl-railname">{OWNER_LABEL[owner]} · {cat}</span>
                      <span className="rl-raildots" />
                      <span className="rl-railcount rl-mono">{String(packing[key].length).padStart(2, "0")}</span>
                    </div>
                    {packing[key].map((it) => {
                      const on = !!(trip.packed && trip.packed[it.id]);
                      const wornOn = trip.days
                        .filter((d) => d.slots.includes(it.id))
                        .map((d) => dayLabel(d.date).slice(0, 3));
                      return (
                        <button
                          key={it.id}
                          className="rl-packrow"
                          style={{ width: "100%", background: "none", border: 0, borderBottom: "1px solid var(--rule-soft)", textAlign: "left" }}
                          onClick={() =>
                            updateTrip({ ...trip, packed: { ...(trip.packed || {}), [it.id]: !on } })
                          }
                        >
                          <span className="rl-packbox" data-on={on ? "true" : "false"}>{on ? "✓" : ""}</span>
                          <span className="rl-packthumb">{it.img && <img src={it.img} alt="" />}</span>
                          <span style={{ flex: 1, fontSize: 14, textDecoration: on ? "line-through" : "none", color: on ? "var(--muted)" : "var(--ink)" }}>
                            {it.name || it.cat}
                          </span>
                          <span className="rl-mono" style={{ fontSize: 10, color: "var(--muted)" }}>
                            {wornOn.join(" ")}
                          </span>
                        </button>
                      );
                    })}
                  </section>
                );
              })}
            </>
          )}
        </div>
      )}

      {picking && (() => {
        const day = trip.days.find((d) => d.id === picking.dayId);
        if (!day) return null;
        const mine = picking.owner
          ? day.slots.filter((id) => allItems[id] && allItems[id].owner === picking.owner)
          : day.slots;
        return (
          <Picker
            closets={closets}
            outfits={outfits}
            allItems={allItems}
            lockOwner={picking.owner}
            title={`${dayLabel(day.date)} ${dayNum(day.date)}`}
            eyebrow={picking.owner ? `${trip.name} · ${OWNER_LABEL[picking.owner]}` : trip.name}
            initial={mine}
            onClose={() => setPicking(null)}
            onConfirm={(ids) => {
              if (!picking.owner) {
                setDay(picking.dayId, { slots: ids });
                return;
              }
              const others = day.slots.filter(
                (id) => !allItems[id] || allItems[id].owner !== picking.owner
              );
              setDay(picking.dayId, { slots: [...others, ...ids] });
            }}
          />
        );
      })()}
    </div>
  );
}

/* ------------------------------------------------------------------ */
/*  gates                                                              */
/* ------------------------------------------------------------------ */

function Centered({ children }) {
  return (
    <div className="rl" style={{ display: "flex", alignItems: "center", justifyContent: "center", padding: 24 }}>
      <style>{CSS}</style>
      <div style={{ background: "#fff", border: "1px solid var(--rule)", padding: 30, maxWidth: 400, width: "100%" }}>
        {children}
      </div>
    </div>
  );
}

function NotConfigured() {
  return (
    <Centered>
      <div className="rl-eyebrow">Setup needed</div>
      <div className="rl-display" style={{ fontSize: 24, margin: "8px 0 14px" }}>Two keys to go</div>
      <p style={{ fontSize: 13, lineHeight: 1.65, color: "var(--muted)", margin: 0 }}>
        Open <code>index.html</code> in a text editor and paste your Supabase project URL and anon key
        into the config block near the top. SETUP.md walks through where to find them.
      </p>
    </Centered>
  );
}

function SignIn() {
  const [mode, setMode] = useState("password");
  const [email, setEmail] = useState("");
  const [password, setPassword] = useState("");
  const [state, setState] = useState("idle");
  const [msg, setMsg] = useState("");

  const friendly = (error) => {
    const m = (error && error.message) || String(error);
    if (/rate limit/i.test(m)) {
      return "Supabase's built-in email is rate limited to a few messages an hour. Use a password instead, or wait an hour.";
    }
    if (/invalid login credentials/i.test(m)) {
      return "That email and password don't match. Passwords are set in Supabase under Authentication \u2192 Users.";
    }
    return m;
  };

  const signInPassword = async () => {
    if (!/.+@.+\..+/.test(email)) { setMsg("That doesn't look like an email address."); return; }
    if (!password) { setMsg("Enter your password."); return; }
    setState("working"); setMsg("");
    const { error } = await supa.auth.signInWithPassword({ email: email.trim(), password });
    if (error) { setState("idle"); setMsg(friendly(error)); return; }
    // a session arriving flips the whole app over; nothing more to do here
  };

  const sendLink = async () => {
    if (!/.+@.+\..+/.test(email)) { setMsg("That doesn't look like an email address."); return; }
    setState("working"); setMsg("");
    const { error } = await supa.auth.signInWithOtp({
      email: email.trim(),
      options: { emailRedirectTo: window.location.href },
    });
    if (error) { setState("idle"); setMsg(friendly(error)); return; }
    setState("sent");
  };

  return (
    <Centered>
      <div className="rl-eyebrow">Wardrobe</div>
      <div className="rl-display" style={{ fontSize: 28, margin: "8px 0 6px" }}>Sign in</div>

      {state === "sent" ? (
        <p style={{ fontSize: 13, lineHeight: 1.65, color: "var(--muted)" }}>
          Link sent to {email}. Open it on this device and you're in. It expires in an hour.
        </p>
      ) : (
        <>
          <p style={{ fontSize: 13, lineHeight: 1.6, color: "var(--muted)", margin: "0 0 18px" }}>
            {mode === "password"
              ? "Use the password set for you in Supabase."
              : "We'll email you a link. Limited to a few per hour."}
          </p>

          <input
            className="rl-field"
            type="email"
            autoFocus
            autoComplete="username"
            value={email}
            placeholder="you@email.com"
            onChange={(e) => { setEmail(e.target.value); setMsg(""); }}
            onKeyDown={(e) => e.key === "Enter" && mode === "link" && sendLink()}
          />

          {mode === "password" && (
            <input
              className="rl-field"
              style={{ marginTop: 10 }}
              type="password"
              autoComplete="current-password"
              value={password}
              placeholder="Password"
              onChange={(e) => { setPassword(e.target.value); setMsg(""); }}
              onKeyDown={(e) => e.key === "Enter" && signInPassword()}
            />
          )}

          <button
            className="rl-btn"
            style={{ marginTop: 12, width: "100%" }}
            onClick={mode === "password" ? signInPassword : sendLink}
            disabled={state === "working"}
          >
            {state === "working" ? "\u2026" : mode === "password" ? "Sign in" : "Email me a link"}
          </button>

          <button
            className="rl-btn quiet tiny"
            style={{ marginTop: 10, width: "100%" }}
            onClick={() => { setMode(mode === "password" ? "link" : "password"); setMsg(""); }}
          >
            {mode === "password" ? "Email me a link instead" : "Use a password instead"}
          </button>

          {msg && (
            <div style={{ marginTop: 12, fontSize: 12, color: "var(--accent)", lineHeight: 1.55 }}>
              {msg}
            </div>
          )}
        </>
      )}
    </Centered>
  );
}

/* ------------------------------------------------------------------ */
/*  app                                                                */
/* ------------------------------------------------------------------ */

function App({ session }) {
  const [ready, setReady] = useState(false);
  const [view, setView] = useState("closet");
  const [openTrip, setOpenTrip] = useState(null);
  const [closets, setClosetsState] = useState({
    her: { items: [], cats: DEFAULT_CATS.her },
    his: { items: [], cats: DEFAULT_CATS.his },
  });
  const [trips, setTripsState] = useState([]);
  const [outfits, setOutfitsState] = useState([]);
  const [adding, setAdding] = useState(null);
  const [detail, setDetail] = useState(null);
  const [status, setStatus] = useState("");
  const catsRef = useRef(null);

  const flash = (t) => { setStatus(t); setTimeout(() => setStatus(""), 1800); };

  const [loadError, setLoadError] = useState(null);

  const load = useCallback(async () => {
    setLoadError(null);
    try {
      const d = await db.loadAll();
      setClosetsState(d.closets);
      setTripsState(d.trips);
      setOutfitsState(d.outfits);
      catsRef.current = { her: d.closets.her.cats, his: d.closets.his.cats };
      setReady(true);
    } catch (e) {
      const msg = (e && (e.message || e.error_description)) || String(e);
      const code = e && e.code ? ` (${e.code})` : "";
      const hint = e && e.hint ? ` ${e.hint}` : "";
      setLoadError(msg + code + hint);
    }
  }, []);

  useEffect(() => { load(); }, [load]);

  /* live sync between the two of you */
  useEffect(() => {
    if (!supa) return;
    let timer = null;
    const ch = supa
      .channel("rail-live")
      .on("postgres_changes", { event: "*", schema: "public" }, () => {
        if (Date.now() - lastLocalWrite < 2500) return;
        clearTimeout(timer);
        timer = setTimeout(load, 700);
      })
      .subscribe();
    return () => { clearTimeout(timer); supa.removeChannel(ch); };
  }, [load]);

  /* categories persist when they change */
  const setClosets = (updater) => {
    setClosetsState((prev) => {
      const next = typeof updater === "function" ? updater(prev) : updater;
      ["her", "his"].forEach((o) => {
        const before = catsRef.current ? catsRef.current[o] : null;
        if (before && JSON.stringify(before) !== JSON.stringify(next[o].cats)) {
          db.saveCats(o, next[o].cats);
          catsRef.current[o] = next[o].cats;
        }
      });
      return next;
    });
  };

  /* trips + outfits persist by diffing */
  const setTrips = (updater) => {
    setTripsState((prev) => {
      const next = typeof updater === "function" ? updater(prev) : updater;
      const prevIds = new Set(prev.map((t) => t.id));
      const nextIds = new Set(next.map((t) => t.id));
      prev.forEach((t) => { if (!nextIds.has(t.id)) db.deleteTrip(t.id); });
      next.forEach((t) => {
        const old = prev.find((p) => p.id === t.id);
        if (!prevIds.has(t.id)) db.saveTrip(t);
        else if (old !== t) saveTripSoon(t);
      });
      return next;
    });
  };

  const setOutfits = (updater) => {
    setOutfitsState((prev) => {
      const next = typeof updater === "function" ? updater(prev) : updater;
      const nextIds = new Set(next.map((o) => o.id));
      prev.forEach((o) => { if (!nextIds.has(o.id)) db.deleteOutfit(o.id); });
      next.forEach((o) => {
        const old = prev.find((p) => p.id === o.id);
        if (!old || old !== o) db.saveOutfit(o);
      });
      return next;
    });
  };

  const allItems = useMemo(() => {
    const m = {};
    closets.her.items.forEach((i) => (m[i.id] = i));
    closets.his.items.forEach((i) => (m[i.id] = i));
    return m;
  }, [closets]);

  const addItems = async (items) => {
    const owner = items[0].owner;
    setClosetsState((cs) => ({ ...cs, [owner]: { ...cs[owner], items: [...cs[owner].items, ...items] } }));
    const { error } = await db.addItems(items);
    flash(error ? "Couldn't save — check your connection" : `Added ${items.length}`);
    if (error) load();
  };

  const saveItem = async (item) => {
    setClosetsState((cs) => ({
      ...cs,
      [item.owner]: { ...cs[item.owner], items: cs[item.owner].items.map((i) => (i.id === item.id ? item : i)) },
    }));
    const { error } = await db.updateItem(item);
    if (error) { flash("Couldn't save"); load(); }
  };

  const deleteItem = async (id) => {
    setClosetsState((cs) => ({
      her: { ...cs.her, items: cs.her.items.filter((i) => i.id !== id) },
      his: { ...cs.his, items: cs.his.items.filter((i) => i.id !== id) },
    }));
    setTrips((ts) =>
      ts.map((t) => {
        const touched = t.days.some((d) => d.slots.includes(id));
        if (!touched) return t;
        return { ...t, days: t.days.map((d) => ({ ...d, slots: d.slots.filter((s) => s !== id) })) };
      })
    );
    setOutfits((os) =>
      os.map((o) => (o.items.includes(id) ? { ...o, items: o.items.filter((i) => i !== id) } : o))
    );
    await db.deleteItem(id);
  };

  const trip = trips.find((t) => t.id === openTrip);
  const size = approxSize(closets.her) + approxSize(closets.his);
  const heavy = size > 6_000_000;

  return (
    <div className="rl">
      <style>{CSS}</style>

      <header className="rl-top">
        <div className="rl-topin">
          <div className="rl-brand">
            <span className="rl-wordmark">Wardrobe</span>
            <span className="rl-mono" style={{ fontSize: 10, color: "var(--muted)" }}>
              {status || (session.user.email || "").split("@")[0]}
            </span>
          </div>
          <nav className="rl-nav">
            {[["closet", "Closet"], ["outfits", "Outfits"], ["trips", "Trips"]].map(([k, l]) => (
              <button
                key={k}
                className="rl-navbtn"
                data-on={view === k ? "true" : "false"}
                onClick={() => { setView(k); setOpenTrip(null); }}
              >
                {l}
              </button>
            ))}
          </nav>
        </div>
      </header>

      <main className="rl-wrap">
        {!ready ? (
          loadError ? (
            <div style={{ maxWidth: 420, margin: "40px auto", textAlign: "center" }}>
              <div className="rl-eyebrow" style={{ marginBottom: 8 }}>Couldn't open the closet</div>
              <p style={{ fontSize: 13, color: "var(--muted)", lineHeight: 1.6, marginBottom: 12 }}>
                Signed in fine, but the closet tables couldn't be read. Nothing has been
                changed or lost.
              </p>
              <p className="rl-mono" style={{
                fontSize: 11, color: "var(--ink)", background: "var(--paper)",
                border: "1px solid var(--rule)", padding: "10px 12px",
                marginBottom: 16, textAlign: "left", wordBreak: "break-word", lineHeight: 1.5,
              }}>
                {loadError}
              </p>
              <p style={{ fontSize: 12, color: "var(--muted)", lineHeight: 1.6, marginBottom: 16 }}>
                If that mentions a relation or table not existing, schema.sql hasn't run in
                this project — open Supabase → SQL Editor and run it.
              </p>
              <button className="rl-btn" onClick={load}>Try again</button>
            </div>
          ) : (
            <div className="rl-eyebrow">Opening the wardrobe…</div>
          )
        ) : (
          <>
            {heavy && (
              <div style={{ background: "var(--tag)", padding: "10px 14px", fontSize: 12, marginBottom: 20, color: "#3A3208" }}>
                The closet is {fmtBytes(size)}. Still fine, but worth clearing out pieces you no longer wear.
              </div>
            )}

            {view === "closet" && (
              <Closet closets={closets} setClosets={setClosets} openItem={setDetail} openAdd={setAdding} />
            )}

            {view === "outfits" && (
              <Outfits closets={closets} outfits={outfits} setOutfits={setOutfits} allItems={allItems} />
            )}

            {view === "trips" && !trip && (
              <TripList trips={trips} setTrips={setTrips} allItems={allItems} onOpen={setOpenTrip} />
            )}

            {view === "trips" && trip && (
              <TripDetail
                trip={trip}
                updateTrip={(t) => setTrips((ts) => ts.map((x) => (x.id === t.id ? t : x)))}
                deleteTrip={(id) => setTrips((ts) => ts.filter((x) => x.id !== id))}
                closets={closets}
                outfits={outfits}
                allItems={allItems}
                onBack={() => setOpenTrip(null)}
              />
            )}

            <footer style={{ marginTop: 60, paddingTop: 16, borderTop: "1px solid var(--rule)", fontSize: 11, color: "var(--muted)", lineHeight: 1.7, display: "flex", justifyContent: "space-between", gap: 16, flexWrap: "wrap" }}>
              <span>
                Signed in as {session.user.email}. Changes appear on the other person's screen within
                a few seconds.
              </span>
              <button
                className="rl-btn quiet tiny"
                onClick={() => supa.auth.signOut()}
              >
                Sign out
              </button>
            </footer>
          </>
        )}
      </main>

      {adding && (
        <AddPieces
          owner={adding}
          closets={closets}
          setClosets={setClosets}
          onClose={() => setAdding(null)}
          onAdd={addItems}
        />
      )}

      {detail && (
        <ItemDetail
          item={detail}
          cats={closets[detail.owner].cats}
          onClose={() => setDetail(null)}
          onSave={saveItem}
          onDelete={deleteItem}
        />
      )}
    </div>
  );
}

/* ------------------------------------------------------------------ */
/*  boot                                                               */
/* ------------------------------------------------------------------ */

function Root() {
  const [session, setSession] = useState(undefined);

  useEffect(() => {
    if (!supa) return;
    supa.auth.getSession().then(({ data }) => setSession(data.session || null));
    const { data: sub } = supa.auth.onAuthStateChange((_e, s) => setSession(s));
    return () => sub.subscription.unsubscribe();
  }, []);

  if (!CONFIGURED) return <NotConfigured />;
  if (session === undefined) return <Centered><div className="rl-eyebrow">Checking…</div></Centered>;
  if (!session) return <SignIn />;
  return <App session={session} />;
}

ReactDOM.createRoot(document.getElementById("root")).render(<Root />);

</script>
